services:
  - type: web
    name: on-zen-on
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: on-zen-on-postgres
          property: connectionString

databases:
  - name: on-zen-on-postgres
    region: singapore
    plan: free
    databaseName: onzenon
    user: onzenon
