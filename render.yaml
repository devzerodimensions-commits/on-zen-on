services:
  - type: web
    name: on-zen-on
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.19.0
      - key: APP_ORIGIN
        value: https://on-zen-on.onrender.com
      - key: TRUST_PROXY_HOPS
        value: 1
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: on-zen-on-postgres
          property: connectionString

databases:
  - name: on-zen-on-postgres
    region: singapore
    plan: free
    databaseName: onzenon
    user: onzenon
